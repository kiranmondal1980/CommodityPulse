name: CommodityPulse
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # required so the "Commit state files" step below can push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta requests
      - name: Run Bot
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # GitHub Actions runners are ephemeral — regime_state.json (Auto Router
      # hysteresis), last_alerts.json (duplicate guard), and open_positions.json
      # (correlation risk cap) only persist across the next scheduled run if we
      # commit the changes back to the repo here. Without this step, all three
      # silently reset every 15 minutes no matter what the Python code does.
      - name: Commit state files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add regime_state.json last_alerts.json open_positions.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update bot state [skip ci]"
          git pull --rebase --autostash || true
          git push || echo "Nothing to push or push failed — check repo permissions."
